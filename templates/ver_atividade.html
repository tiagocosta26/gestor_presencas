<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8-sig">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ ficheiro }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    h1 {
      color: #007bff;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
    }
    table th, table td {
      padding: 8px;
      text-align: left;
      border: 1px solid #dee2e6;
    }
    table th {
      background-color: #007bff;
      color: white;
    }
    table td {
      background-color: #ffffff;
    }
  </style>
</head>
<body class="container mt-4">
  <h1 class="text-center">{{ ficheiro.split('_')[0] }}</h1>
  <p class="text-center text-muted">{{ data_display }}</p>

  {% for tribo_nome, presencas in dados.items() %}
    <h3>{{ tribo_nome }}</h3>
    <table class="table table-striped mt-4">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Presente</th>
        </tr>
      </thead>
      <tbody>
        {% for nome, presente in presencas %}
          <tr>
            <td>{{ nome }}</td>
            <td>{{ presente }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% endfor %}

  <div class="d-flex justify-content-between mt-4 mb-4">
    <a href="{{ url_for('atividades') }}" class="btn btn-secondary">← Voltar</a>
    <form method="post" action="{{ url_for('eliminar_atividade', nome_ficheiro=ficheiro) }}">
      <button type="submit" class="btn btn-danger">Eliminar Atividade</button>
    </form>
  </div>
</body>
</html>
