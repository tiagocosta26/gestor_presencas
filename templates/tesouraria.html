<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8-sig">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesouraria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h1 {
            color: #007bff;
        }
        .table-entrada {
            color: #155724;
            background-color: #d4edda;
        }
        .table-saida {
            color: #721c24;
            background-color: #f8d7da;
        }
        .saldo-positivo {
            color: #28a745;
        }
        .saldo-negativo {
            color: #dc3545;
        }
        .total-box {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="container mt-4">
    <h1 class="text-center">Tesouraria</h1>

    <div class="card my-4">
        <div class="card-header">
            <ul class="nav nav-tabs card-header-tabs" id="myTab" role="tablist">
                <li class="nav-item">
                    <button class="nav-link {% if entidade_ativa == 'Clan' %}active{% endif %}" id="clan-tab" data-bs-toggle="tab" data-bs-target="#clan" type="button" role="tab" aria-controls="clan" aria-selected="{% if entidade_ativa == 'Clan' %}true{% else %}false{% endif %}">Clan</button>
                </li>
                {% for tribo in tribos %}
                <li class="nav-item">
                    <button class="nav-link {% if entidade_ativa == tribo %}active{% endif %}" id="{{ tribo|replace(' ', '_') }}-tab" data-bs-toggle="tab" data-bs-target="#{{ tribo|replace(' ', '_') }}" type="button" role="tab" aria-controls="{{ tribo|replace(' ', '_') }}" aria-selected="{% if entidade_ativa == tribo %}true{% else %}false{% endif %}">{{ tribo }}</button>
                </li>
                {% endfor %}
            </ul>
        </div>
        <div class="card-body">
            <div class="tab-content" id="myTabContent">
                <div class="tab-pane fade {% if entidade_ativa == 'Clan' %}show active{% endif %}" id="clan" role="tabpanel" aria-labelledby="clan-tab">
                    <h3 class="card-title mb-3">Folha de Caixa Clan</h3>
                    {% include 'partials/folha_caixa.html' with context %}
                </div>
                {% for tribo in tribos %}
                <div class="tab-pane fade {% if entidade_ativa == tribo %}show active{% endif %}" id="{{ tribo|replace(' ', '_') }}" role="tabpanel" aria-labelledby="{{ tribo|replace(' ', '_') }}-tab">
                    <h3 class="card-title mb-3">Folha de Caixa Tribo {{ tribo }}</h3>
                    {% include 'partials/folha_caixa.html' with context %}
                </div>
                {% endfor %}
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-start mt-4 mb-4">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">← Voltar</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const tabs = document.querySelectorAll('button[data-bs-toggle="tab"]');
        tabs.forEach(tab => {
            tab.addEventListener('shown.bs.tab', event => {
                localStorage.setItem('activeTab', event.target.id);
            });
        });
        
        document.addEventListener('DOMContentLoaded', function() {
            const activeTabLS = localStorage.getItem('activeTab');
            const hasActiveTabInURL = window.location.search.includes('entidade_ativa');

            // Ativa a aba do localStorage apenas se a URL não tiver um parâmetro de aba ativa
            if (activeTabLS && !hasActiveTabInURL) {
                const tabButton = document.getElementById(activeTabLS);
                if (tabButton) {
                    new bootstrap.Tab(tabButton).show();
                }
            }
        });
    </script>
</body>
</html>
