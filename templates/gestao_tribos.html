<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8-sig">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Tribos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
    body {
      background-color: #f8f9fa;
    }
    h1 {
      color: #007bff;
    }
    .list-group-item {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      margin-bottom: 10px;
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="container mt-4">
    <h1 class="text-center">Gestão de Tribos</h1>

    {% for tribo, membros in tribos.items() %}
    <div class="card my-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3>{{ tribo }}</h3>
            <form method="post" action="{{ url_for('gestao_tribos') }}">
                <input type="hidden" name="acao" value="remover_tribo">
                <input type="hidden" name="nome_tribo" value="{{ tribo }}">
                <button class="btn btn-sm btn-danger" type="submit">Remover Tribo</button>
            </form>
        </div>
        <div class="card-body">
            <ul id="lista-{{ loop.index }}" class="list-group sortable" data-tribo="{{ tribo }}">
                {% for pessoa in membros %}
                <li class="list-group-item d-flex justify-content-between align-items-center sortable-handle">
                    <i class="bi bi-grip-vertical me-2"></i>
                    <span>{{ pessoa }}</span>
                    <form method="post" action="{{ url_for('gestao_tribos') }}" style="display:inline;">
                        <input type="hidden" name="acao" value="remover_pessoa">
                        <input type="hidden" name="tribo" value="{{ tribo }}">
                        <input type="hidden" name="nome_pessoa" value="{{ pessoa }}">
                        <button class="btn btn-sm btn-danger" type="submit">Remover</button>
                    </form>
                </li>
                {% endfor %}
            </ul>

            <form method="post" action="{{ url_for('gestao_tribos') }}" class="mt-3">
                <input type="hidden" name="acao" value="adicionar_pessoa">
                <input type="hidden" name="tribo" value="{{ tribo }}">
                <div class="input-group">
                    <input type="text" name="nome_pessoa" placeholder="Nome do novo elemento" class="form-control" required>
                    <button class="btn btn-success" type="submit">Adicionar</button>
                </div>
            </form>
        </div>
    </div>
    {% endfor %}

    <div class="card my-4">
        <div class="card-header">
            <h3>Criar Nova Tribo</h3>
        </div>
        <div class="card-body">
            <form method="post" action="{{ url_for('gestao_tribos') }}">
                <input type="hidden" name="acao" value="criar_tribo">
                <div class="input-group">
                    <input type="text" name="nome_tribo" placeholder="Nome da nova tribo" class="form-control" required>
                    <button class="btn btn-primary" type="submit">Criar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex justify-content-start mt-4 mb-4">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">← Voltar</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Itera sobre todas as listas com a classe "sortable"
            document.querySelectorAll(".sortable").forEach(function(lista) {
                new Sortable(lista, {
                    animation: 150,
                    handle: '.sortable-handle', // Define que apenas o item inteiro pode ser arrastado
                    // Função executada quando o arrastar e soltar termina
                    onEnd: function(evt) {
                        let tribo = lista.getAttribute("data-tribo");
                        // Mapeia os elementos <li> para obter o texto de cada um (nome da pessoa)
                        let novaOrdem = Array.from(lista.children).map(li => li.querySelector('span').innerText);

                        // Envia a nova ordem para o servidor via fetch
                        fetch("/reordenar_pessoas", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ tribo: tribo, nova_ordem: novaOrdem })
                        }).then(res => {
                            if (!res.ok) {
                                alert("Erro ao guardar a nova ordem!");
                            }
                        }).catch(error => {
                            console.error('Erro:', error);
                            alert("Erro ao comunicar com o servidor!");
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
