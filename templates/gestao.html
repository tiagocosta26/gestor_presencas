<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Gestão de Tribos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
  <h1 class="text-center mb-4">Gestão de Tribos</h1>

  <h3>Criar nova tribo</h3>
  <form method="post" class="mb-4">
    <input type="hidden" name="acao" value="criar_tribo">
    <div class="input-group">
      <input type="text" name="tribo" placeholder="Nome da tribo" class="form-control" required>
      <button class="btn btn-primary" type="submit">Criar</button>
    </div>
  </form>

  <h3>Editar tribos existentes</h3>
  {% for tribo, membros in tribos.items() %}
    <div class="card mb-3">
      <div class="card-header d-flex justify-content-between align-items-center">
        <strong>{{ tribo }}</strong>
        <form method="post" class="d-inline">
          <input type="hidden" name="acao" value="eliminar_tribo">
          <input type="hidden" name="tribo" value="{{ tribo }}">
          <button type="submit" class="btn btn-danger btn-sm">Eliminar tribo</button>
        </form>
      </div>
      <div class="card-body">
        <h5>Membros:</h5>
        <ul class="list-group mb-3">
          {% for membro in membros %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
              {{ membro }}
              <form method="post" class="d-inline">
                <input type="hidden" name="acao" value="remover_pessoa">
                <input type="hidden" name="tribo" value="{{ tribo }}">
                <input type="hidden" name="nome" value="{{ membro }}">
                <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
              </form>
            </li>
          {% endfor %}
        </ul>
        <form method="post" class="input-group">
          <input type="hidden" name="acao" value="adicionar_pessoa">
          <input type="hidden" name="tribo" value="{{ tribo }}">
          <input type="text" name="nome" class="form-control" placeholder="Novo membro" required>
          <button type="submit" class="btn btn-success">Adicionar</button>
        </form>
      </div>
    </div>
  {% endfor %}

  <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">← Voltar</a>
</body>
</html>
